[package]
name = "adsb-router"
version = "0.1.0"
edition = "2021"
description = "ADS-B plane tracking service with gRPC interface"
license = "MIT"

[dependencies]
# Async runtime
tokio = { version = "1.53", features = ["full"] }
tokio-stream = "0.1"

# ADS-B decoding
adsb_deku = "0.7"

# gRPC
tonic = "0.14"
tonic-prost = "0.14"
prost = "0.14"
prost-types = "0.14"

# Concurrent data structures
dashmap = "6.1"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Utilities
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "2.0"
anyhow = "1.0"
futures = "0.3"
async-stream = "0.3"

# Configuration
clap = { version = "4.5", features = ["derive"] }
toml = "1.1"

# Terminal UI
ratatui = "0.30"
crossterm = "0.29"

[build-dependencies]
tonic-prost-build = "0.14"
protobuf-src = "2.1"

[[bin]]
name = "adsb-router"
path = "src/main.rs"

[[bin]]
name = "adsb-terminal"
path = "src/bin/adsb_terminal/main.rs"
